name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run linting (flake8)
        run: make lint
        
      - name: Run type checking (mypy)
        run: make type-check
        
      - name: Run tests with coverage
        run: make test-coverage

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run integration tests
        env:
          ELFA_API_KEY: ${{ secrets.ELFA_API_KEY }}
        run: |
          python examples/basic_usage.py
          python examples/async_usage.py
          python examples/auto_and_trade.py
        continue-on-error: true # Don't fail CI if API key not available

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Pinned to a minor line: these two now decide whether CI passes, so
          # an unannounced major would change the gate under us. The advisory
          # database is fetched at run time, so pinning the tool does not stale
          # the findings.
          pip install "pip-audit~=2.10" "bandit~=1.9"

      # pip-audit rather than safety: safety 3 requires an account for the full
      # advisory database and has deprecated `safety check`, so it degraded to
      # a no-op here. pip-audit is PyPA's, needs no auth, and fails the job.
      #
      # `.` audits the project's declared dependency tree in an isolated build
      # env, not the ambient one. Auditing the environment flags the runner's
      # own setuptools/pip — build tooling this package never ships — which
      # fails the job over something no release of ours can fix. Same intent as
      # `npm audit --omit=dev` on the JS SDK: audit what consumers install.
      - name: Run dependency audit (pip-audit)
        run: pip-audit --progress-spinner off .

      # -ll reports medium severity and above and exits non-zero on a finding.
      - name: Run security linter (bandit)
        run: bandit -r elfa/ -ll

  publish-check:
    name: Publish Readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"
          
      - name: Check package metadata
        run: |
          # Verify pyproject.toml has required fields
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          project = data['project']
          required = ['name', 'version', 'description', 'readme', 'license', 'authors']
          missing = [field for field in required if field not in project]
          if missing:
              print(f'❌ Missing required pyproject.toml fields: {missing}')
              exit(1)
          print('✅ Package metadata validation passed')
          "
          
      - name: Build package
        run: make build
        
      - name: Verify build artifacts
        run: |
          # Check if distribution files are created
          test -f dist/*.whl || (echo "❌ Missing wheel file" && exit 1)
          test -f dist/*.tar.gz || (echo "❌ Missing source distribution" && exit 1)
          echo "✅ All build artifacts present"
          
      - name: Check package contents
        run: |
          # Verify package contents
          python -m twine check dist/*
          echo "✅ Package contents verified"
          
      - name: Test package installation
        run: |
          # Create virtual environment and test installation
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          python -c "import elfa; print('✅ Package imports successfully')"
          deactivate
          rm -rf test_env