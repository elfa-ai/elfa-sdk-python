name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.1)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run full test suite
        run: |
          make lint
          make type-check
          make test-coverage
          
      - name: Validate version
        if: github.event.inputs.version
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['version'])")
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ "$PACKAGE_VERSION" != "$INPUT_VERSION" ]; then
            echo "❌ Version mismatch: pyproject.toml has $PACKAGE_VERSION but input is $INPUT_VERSION"
            exit 1
          fi
          echo "✅ Version validation passed"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate
    environment: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e ".[dev]"
          
      - name: Build package
        run: make build
        
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          
      - name: Get package info
        id: package
        run: |
          echo "name=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['name'])")" >> $GITHUB_OUTPUT
          echo "version=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['version'])")" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for changelog
          
      - name: Get package info
        id: package
        run: |
          echo "name=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['name'])")" >> $GITHUB_OUTPUT
          echo "version=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['version'])")" >> $GITHUB_OUTPUT
          
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          CURRENT_TAG="v${{ steps.package.outputs.version }}"
          
          echo "## Changes" > CHANGELOG.md
          
          if [ -n "$PREV_TAG" ]; then
            echo "" >> CHANGELOG.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges >> CHANGELOG.md
          else
            echo "- Initial release" >> CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "## Installation" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "pip install ${{ steps.package.outputs.name }}==${{ steps.package.outputs.version }}" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md
          
          echo "" >> CHANGELOG.md
          echo "## API Reference" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "For detailed API documentation, visit [docs.elfa.ai](https://docs.elfa.ai)" >> CHANGELOG.md
          
          # Output for GitHub release
          cat CHANGELOG.md >> $GITHUB_STEP_SUMMARY
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Release v${{ steps.package.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [validate, publish, create-release]
    if: success()
    
    steps:
      - name: Get package info
        id: package
        run: |
          echo "name=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['name'])")" >> $GITHUB_OUTPUT
          echo "version=$(python -c "import tomllib; f=open('pyproject.toml','rb'); data=tomllib.load(f); f.close(); print(data['project']['version'])")" >> $GITHUB_OUTPUT
          
      - name: Notify success
        run: |
          echo "🎉 Successfully released ${{ steps.package.outputs.name }}==${{ steps.package.outputs.version }}"
          echo "📦 PyPI: https://pypi.org/project/${{ steps.package.outputs.name }}/"
          echo "🏷️ GitHub: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.package.outputs.version }}"